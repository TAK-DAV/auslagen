<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zwei-Faktor-Code</title>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
<main>
  <h1>Authenticator-Code</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    <label>6-stelliger Code<input name="token" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button type="submit" class="primary">Bestätigen</button>
  </form>
</main>
</body>
</html>
