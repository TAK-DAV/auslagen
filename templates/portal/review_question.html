{% extends "portal/base.html" %}
{% block title %}Rückfrage{% endblock %}
{% block content %}
<h1>Rückfrage zu #{{ report.pk }}</h1>
{% if line %}<p>Bezug: Position {{ line.get_expense_type_display }} ({{ line.gross }} €)</p>{% endif %}
<form method="post" class="stack">
  {% csrf_token %}
  {% if line %}<input type="hidden" name="line" value="{{ line.pk }}">{% endif %}
  <label>Kommentar<textarea name="body" rows="4" required></textarea></label>
  <button type="submit" class="primary">Zurück an Einreicher</button>
  <a href="{% url 'portal:review_report' report.pk %}">Abbrechen</a>
</form>
{% endblock %}
