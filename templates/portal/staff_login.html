{% extends "portal/base.html" %}
{% block title %}Team-Anmeldung{% endblock %}
{% block content %}
  <h1>Team-Anmeldung</h1>
  <p>Für Freigeber, Schatzmeister und Admins. Anschließend Zwei-Faktor-Code.</p>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Anmelden</button>
  </form>
  <p><a href="{% url 'portal:login_request' %}">Zurück zur Einreicher-Anmeldung</a></p>
{% endblock %}
