# Filter for Fail2ban – copy to /etc/fail2ban/filter.d/auslagen-auth.conf
#
# Matches lines written by the auslagen.auth logger, e.g.:
#   2026-10-12 10:00:00,000 WARNING AUTH_RATE_LIMIT action=magic_link ip=1.2.3.4 path=/einreichen/anmelden/
#   2026-10-12 10:00:01,000 WARNING AUTH_FAIL action=staff_login ip=1.2.3.4 path=/einreichen/team/anmelden/ detail=x@y.de

[Definition]
failregex = ^.*AUTH_RATE_LIMIT action=\S+ ip=<HOST> path=.*$
            ^.*AUTH_FAIL action=\S+ ip=<HOST> path=.*$
ignoreregex =
