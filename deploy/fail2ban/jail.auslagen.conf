# Jail for Fail2ban – copy to /etc/fail2ban/jail.d/auslagen.conf
#
# Requires the auth log on the host:
#   /var/log/auslagen/auth.log
# (mounted from the web container via docker-compose.prod.yml)

[auslagen-auth]
enabled = true
filter = auslagen-auth
logpath = /var/log/auslagen/auth.log
backend = auto
maxretry = 8
findtime = 1h
bantime = 1h
port = http,https
banaction = iptables-multiport
