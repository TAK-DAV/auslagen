# Production stack for AWS Lightsail (or any Linux VPS).
# Start: docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres is NOT published to the internet. Only Caddy opens 80/443.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - /var/log/auslagen:/var/log/auslagen
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from other containers / localhost on the host.
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - staticfiles:/srv/static:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
  staticfiles:
  caddy_data:
  caddy_config:
